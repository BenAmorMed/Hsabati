services:
  postgres:
    image: postgres:15-alpine
    container_name: gravitywallet-db
    restart: always
    environment:
      POSTGRES_USER: gravityuser
      POSTGRES_PASSWORD: gravitypassword
      POSTGRES_DB: gravitywallet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gravitywallet-sync
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
