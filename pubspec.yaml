name: hsabati
description: "Hsabati — Personal Finance Tracker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  google_sign_in: ^6.2.2

  # Local Database (offline-first)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Networking
  dio: ^5.8.0+1
  socket_io_client: ^3.0.1
  
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Charts
  fl_chart: ^0.70.2

  # Notifications
  flutter_local_notifications: ^18.0.1

  # UI Enhancements
  google_fonts: ^6.2.1
  intl: ^0.20.2
  flutter_slidable: ^3.1.1
  shimmer: ^3.0.0
  lottie: ^3.3.1
  animate_do: ^3.3.4
  gap: ^3.0.1
  flutter_svg: ^2.0.17
  percent_indicator: ^4.2.3
  smooth_page_indicator: ^1.2.0+3

  # Utilities
  uuid: ^4.5.1
  connectivity_plus: ^6.1.4
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  csv: ^6.0.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
